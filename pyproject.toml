[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "pydesktools"
dynamic = ["version"]
description = "Offline desktop toolbox with isolated Python plugins"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=12.3,<13", "pydeskui>=0.2.3,<0.3", "pydesktools-runtime>=0.1.1,<0.2", "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'", "tkinterdnd2>=0.6.3,<0.7"]
[project.scripts]
pydesktools = "pydesktools.app:main"
[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6", "pytest>=8", "ruff>=0.12", "mypy>=1.15", "types-simplejson>=4.1", "babel>=2.17", "pyinstaller>=6.15,<7"]
[tool.setuptools]
include-package-data = false
[tool.setuptools.dynamic]
version = {attr = "pydesktools._version.VERSION"}
[tool.setuptools.packages.find]
where = ["src"]
include = ["pydesktools"]
[tool.setuptools.package-data]
pydesktools = ["assets/*", "py.typed", "bundles/*.pdtplugin", "bundles/*.json", "locales/**/*.mo"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/pydesktools", "packages/pydesktools-sdk/src", "packages/pydesktools-runtime/src", "plugins/json-tools/src", "plugins/image-compressor/src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["AppKit", "Foundation", "objc"]
ignore_missing_imports = true
