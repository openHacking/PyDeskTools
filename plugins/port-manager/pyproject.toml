[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pydesk-port-manager"
version = "0.1.0"
description = "Local development port inspection for PyDeskTools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pydesktools-sdk>=0.1.1,<0.2", "psutil>=7.2.2,<8"]

[tool.setuptools.packages.find]
where = ["src"]
